name: Build mod
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 sandevistan_all_in_one.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.1.1
      - run: gradle build --no-daemon -p sandevistan-mod
      - uses: actions/upload-artifact@v4
        with:
          name: sandevistan-mod
          path: sandevistan-mod/build/libs/*.jar
